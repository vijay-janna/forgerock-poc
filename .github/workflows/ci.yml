# Validation pipeline for the POC's deployment code. Thin wrapper around
# ci-validate.sh (run it locally for the same result). Does not deploy: a
# GitHub-hosted runner can't reach the local minikube, and a full platform
# deploy needs ~10-14 GB RAM -- more than standard private-repo runners have.
# See INSTALLATION.md §9 (CI/CD).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI results don't drift with runner image updates
  SHELLCHECK_VERSION: v0.10.0
  KUBECONFORM_VERSION: v0.6.7
  YQ_VERSION: v4.44.3
  HELM_VERSION: v3.16.2

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install shellcheck, kubeconform, yq
        run: |
          mkdir -p "$HOME/.local/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
          install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$HOME/.local/bin/"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz
          install kubeconform "$HOME/.local/bin/"
          curl -fsSLo yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          install yq "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate (shellcheck, helm template, kubeconform, policy)
        run: bash ci-validate.sh
        env:
          OUT_DIR: ${{ runner.temp }}/rendered

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: ${{ runner.temp }}/rendered/identity-platform.yaml
          if-no-files-found: ignore
